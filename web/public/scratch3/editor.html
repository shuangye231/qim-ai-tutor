<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <title>Scratch 3 编程编辑器</title>
    <style>
      html, body, #scratch-editor { width: 100%; height: 100%; margin: 0; }
      body { min-width: 1024px; min-height: 640px; overflow: auto; scrollbar-width: thin; scrollbar-color: #91a69d transparent; background: #f2f2f2; }
      body::-webkit-scrollbar { width: 10px; height: 10px; }
      body::-webkit-scrollbar-track { background: transparent; }
      body::-webkit-scrollbar-thumb { border: 3px solid transparent; border-radius: 999px; background: #91a69d; background-clip: content-box; }
      body::-webkit-scrollbar-thumb:hover { background: #638579; background-clip: content-box; }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="scratch-editor"></div>
    <script src="./runtime/scratch-gui-standalone.js"></script>
    <script src="./bridge.js"></script>
  </body>
</html>
